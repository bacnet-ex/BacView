name: Nightly Deploy/Build

on:
# The schedule will be trigger externally - the GitHub schedule is very unreliable
#  schedule:
#    - cron: '0 2 * * *' # run at 2 AM UTC
  workflow_dispatch:

concurrency:
  group: nightly-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: windows
            arch: amd64
            runner: windows-latest
          # setup-beam is currently not supporting windows-arm
          # - platform: windows
          #   arch: arm64
          #   runner: windows-11-arm

    env:
      MIX_ENV: prod
      # Compile-time flag for Tauri (see mix.exs and README)
      BACVIEW_DESKTOP: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git pkg-config file patchelf xdg-utils \
            libssl-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            squashfs-tools rpm
          # AppImage bundling: package name differs on Ubuntu 22.04 vs 24.04.
          sudo apt-get install -y --no-install-recommends libfuse2t64 \
            || sudo apt-get install -y --no-install-recommends libfuse2

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"
          version-type: strict

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'linux'

      - name: Set up Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.platform == 'windows'

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: cargo-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # We'll build the nightly with fresh dependencies,
      # not the ones we've locked for development
      - name: Build Elixir mix release
        run: |
          rm mix.lock || true
          mix setup
          mix desktop.setup
          mix desktop.prepare_release

      - name: Build Tauri release
        run: cd src-tauri && cargo tauri build

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bacview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30

  # Create/update the mutable "nightly" GitHub Release with all matrix installers.
  release:
    name: Nightly Release
    needs: build
    # Publish when any matrix leg succeeded (fail-fast is false).
    if: ${{ always() && !cancelled() && contains(fromJSON('["success", "failure"]'), needs.build.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bacview-*
          merge-multiple: false

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          count=0

          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            # Artifact root is the upload name, e.g. bacview-linux-amd64
            artifact_root="$(printf '%s\n' "$f" | cut -d/ -f2)"
            dest="release-assets/${base}"
            if [ -e "$dest" ]; then
              dest="release-assets/${artifact_root}-${base}"
            fi
            cp -v "$f" "$dest"
            count=$((count + 1))
          done < <(find artifacts -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.app.tar.gz' \) -print0)

          echo "Collected ${count} installer asset(s)"
          ls -la release-assets/ || true
          if [ "$count" -eq 0 ]; then
            echo "No installer assets found under artifacts/" >&2
            find artifacts -type f | head -n 100 || true
            exit 1
          fi

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="nightly"
          TITLE="Nightly Build"
          BUILT_AT="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          NOTES="$(cat <<EOF
          Automated nightly desktop build (unstable pre-release).

          | | |
          |---|---|
          | **Commit** | \`${GITHUB_SHA}\` |
          | **Branch** | \`${GITHUB_REF_NAME}\` |
          | **Workflow run** | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | **Built at** | ${BUILT_AT} |

          Assets are replaced on each successful nightly run.
          EOF
          )"

          # Replace the previous nightly release and tag so assets stay current.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA" \
            release-assets/*
