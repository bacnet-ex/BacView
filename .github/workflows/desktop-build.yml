name: Desktop Build

on:
  workflow_call:
    inputs:
      fresh-dependencies:
        description: Resolve fresh Mix dependencies for nightly builds
        type: boolean
        default: false
      asset-version-suffix:
        description: Suffix added after the version in installer filenames
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: windows
            arch: amd64
            runner: windows-latest
          # setup-beam is currently not supporting windows-arm
          # - platform: windows
          #   arch: arm64
          #   runner: windows-11-arm

    env:
      MIX_ENV: prod
      # Compile-time flag for Tauri (see mix.exs and README)
      BACVIEW_DESKTOP: "1"
      CARGO_TERM_COLOR: always
      FRESH_DEPENDENCIES: ${{ inputs.fresh-dependencies }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git pkg-config file patchelf xdg-utils \
            libssl-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            squashfs-tools rpm
          # AppImage bundling: package name differs on Ubuntu 22.04 vs 24.04.
          sudo apt-get install -y --no-install-recommends libfuse2t64 \
            || sudo apt-get install -y --no-install-recommends libfuse2

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"
          version-type: strict

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'linux'

      - name: Set up Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.platform == 'windows'

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: cargo-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Only nightly builds refresh dependencies; other builds use mix.lock.
      - name: Build Elixir mix release (Linux)
        shell: bash
        run: |
          if [ "$FRESH_DEPENDENCIES" = "true" ]; then
            rm -f mix.lock
          fi
          mix deps.get
          mix deps.compile
          SECRET_KEY_BASE=$(mix phx.gen.secret)
          export SECRET_KEY_BASE

          mix setup
          mix desktop.setup
          mix desktop.prepare_release
        if: matrix.platform == 'linux'

      - name: Build Elixir mix release (Windows)
        run: |
          if ($env:FRESH_DEPENDENCIES -eq "true") {
            Remove-Item mix.lock -ErrorAction SilentlyContinue
          }
          mix deps.get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mix deps.compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SECRET_KEY_BASE = $(mix phx.gen.secret)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          mix setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mix desktop.setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mix desktop.prepare_release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if: matrix.platform == 'windows'

      # Cargo's cache includes bundles from previous builds and versions.
      - name: Remove cached installers
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Build Tauri release
        run: cd src-tauri && cargo tauri build

      - name: Add release asset version suffix
        if: inputs.asset-version-suffix != ''
        shell: bash
        env:
          ASSET_VERSION_SUFFIX: ${{ inputs.asset-version-suffix }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          suffix = os.environ["ASSET_VERSION_SUFFIX"]
          extensions = (".AppImage", ".deb", ".rpm", ".exe", ".msi", ".dmg", ".app.tar.gz")

          for asset in Path("src-tauri/target/release/bundle").rglob("*"):
              if not asset.is_file() or not asset.name.endswith(extensions):
                  continue
              if version not in asset.name:
                  raise ValueError(f"Missing version {version!r} in installer filename: {asset}")
              renamed = asset.with_name(asset.name.replace(version, f"{version}-{suffix}", 1))
              if renamed.exists():
                  raise FileExistsError(renamed)
              asset.rename(renamed)
              print(f"{asset.name} -> {renamed.name}")
          PY

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bacview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30

