[package]
name = "BacView"
version = "0.1.0"
description = "BACnet explorer built in Elixir"
authors = ["bacnet-ex"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bacview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
elixirkit = { path = "../deps/elixirkit/elixirkit_rs" }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
webkit2gtk-nvidia-quirk = "2.1.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

# Android: extract bundled Mix release from APK assets into app data.
# AssetManager is accessed via tauri::wry::prelude::dispatch (Activity JNI),
# not ndk-context (Tauri never initializes that crate).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
